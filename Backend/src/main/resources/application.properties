spring.application.name=homecloud-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/homecloud
spring.datasource.username=homecloud
spring.datasource.password=Your_Secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
# Listen on every network interface so devices on the same LAN can reach HomeCloud.
# Override with SERVER_ADDRESS if you need a different bind address.
server.address=${SERVER_ADDRESS:0.0.0.0}

# File storage. This folder is created automatically inside the backend working directory.
homecloud.storage.location=HomeCloudStorage

# JWT configuration. Use a different secret in production.
homecloud.jwt.secret=HomeCloudSuperSecretKeyForJwtAuthentication123456
homecloud.jwt.expiration-ms=3600000

# Multipart upload limits
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
